<!-- À insérer dans un bloc HTML de https://les-formateurs-ia.fr/.
     Le fichier public/conseiller-ia.html doit d'abord être publié sur la plateforme. -->
<iframe
  id="lfia-conseiller"
  src="https://plateforme.les-formateurs-ia.fr/conseiller-ia.html"
  title="Conseiller Projet IA — Les Formateurs IA"
  width="100%"
  height="1100"
  loading="lazy"
  referrerpolicy="strict-origin-when-cross-origin"
  style="display:block;width:100%;border:0;background:transparent;"
></iframe>
<script>
  (() => {
    const frame = document.getElementById('lfia-conseiller');
    const origin = new URL(frame.src).origin;
    window.addEventListener('message', event => {
      if (event.origin !== origin || event.source !== frame.contentWindow) return;
      const data = event.data;
      if (data?.type !== 'lfia:advisor:resize' || !Number.isFinite(data.height)) return;
      if (data.height < 200 || data.height > 16000) return;
      frame.style.height = Math.ceil(data.height) + 'px';
    });
  })();
</script>
