# Only these dedicated public endpoints accept visitors without a login.
[functions.project-advisor]
verify_jwt = false

# Contact forms of the public site (les-formateurs-ia.fr/contact/…).
[functions.contact-request]
verify_jwt = false

# The one-time password-setup token is the only credential (see the function).
[functions.password-setup]
verify_jwt = false

# Google redirects the browser here after consent: the one-time OAuth state is the credential.
[functions.google-oauth-callback]
verify_jwt = false

# Email button for trainees (/acces/:token): the personal access token is the credential.
[functions.learner-access]
verify_jwt = false

# Visitor demo link (/visite/:token): the visitor link token is the credential.
[functions.visitor-access]
verify_jwt = false

# Client portal download (/espace-client/:token): the personal portal token is the credential.
[functions.client-portal-file]
verify_jwt = false

# Daily cron call (pg_net): authenticated by the CRON_SECRET header instead.
[functions.formation-email-automations]
verify_jwt = false
