# Only these dedicated public endpoints accept visitors without a login.
[functions.project-advisor]
verify_jwt = false

# Contact forms of the public site (les-formateurs-ia.fr/contact/…).
[functions.contact-request]
verify_jwt = false

# The one-time password-setup token is the only credential (see the function).
[functions.password-setup]
verify_jwt = false

# Daily cron call (pg_net): authenticated by the CRON_SECRET header instead.
[functions.formation-email-automations]
verify_jwt = false
