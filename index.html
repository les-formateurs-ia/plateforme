
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <!-- viewport-fit=cover : sans ça, l'app ne dessine pas sous l'encoche/la
           barre d'accueil sur iOS et env(safe-area-inset-*) reste à 0 partout
           (cf. MainLayout.tsx et theme.css pour l'usage de ces variables). -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Site web e-learning IA</title>
      <meta name="description" content="Personalized AI-powered e-learning platform offering tailored lessons, interactive content, and dynamic dashboards to enhance user learning experiences." />
      <meta name="robots" content="noindex, nofollow" />
      <!-- Valeur de secours avant le premier rendu React — src/app/theme/theme.tsx
           la met ensuite à jour dynamiquement selon le thème clair/sombre choisi. -->
      <meta name="theme-color" content="#F7F7FA" media="(prefers-color-scheme: light)" />
      <meta name="theme-color" content="#0A0A10" media="(prefers-color-scheme: dark)" />
      <!--
        Chargée ici (et pas via @import dans fonts.css) pour que le scanner de
        préchargement du navigateur la découvre dès le parsing du HTML, en
        parallèle du JS/CSS de l'app — un @import niché dans le bundle CSS
        n'est découvert qu'après le téléchargement + parsing de tout ce
        bundle, donc la police arrive tard sur un chargement à froid. Ce
        retard provoquait un repaint de bascule de police pendant lequel les
        titres en dégradé (GT, background-clip:text) pouvaient s'afficher en
        bloc plein non découpé — jamais vu en navigation interne (police déjà
        en cache), seulement au rechargement complet de la page.
      -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;400;500;600;700;800;900&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,300;1,14..32,400&display=swap" />
      <style>html, body { height: 100%; margin: 0; overflow-x: hidden; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
